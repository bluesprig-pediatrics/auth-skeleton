name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql+psycopg://auth:auth@localhost:5432/auth
  ENV: test
  ENTRA_TENANT_ID: 11111111-1111-1111-1111-111111111111
  ENTRA_CLIENT_ID: 22222222-2222-2222-2222-222222222222
  ENTRA_CLIENT_SECRET: test
  REDIRECT_URI: http://localhost:57005/auth/callback

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Compose, not a services: block, so local and CI run one definition.
      - name: Start Postgres
        run: docker compose up -d --wait db
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy src
      # Rendered to a file rather than piped: GitHub Actions runs steps under
      # `bash -e` without pipefail, so a failing alembic would hand squawk an
      # empty stdin and the step would pass green.
      - name: Render migrations
        run: uv run alembic upgrade base:head --sql > migrations.sql
      - name: Lint migrations
        run: |
          test -s migrations.sql
          uv run squawk migrations.sql
      - name: Test
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --wait db
      - run: docker build -t auth-skeleton:ci .

      # The suite drives the app in-process, so without this the deployable
      # artifact is never actually started.
      # Proves the image carries alembic.ini and the versions directory, and
      # that the documented deploy step works inside it. Without this the
      # smoke test passes with no database running at all.
      - name: Migrate from inside the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql+psycopg://auth:auth@localhost:5432/auth \
            -e ENTRA_TENANT_ID=11111111-1111-1111-1111-111111111111 \
            -e ENTRA_CLIENT_ID=22222222-2222-2222-2222-222222222222 \
            -e ENTRA_CLIENT_SECRET=ci \
            -e REDIRECT_URI=https://app.example/auth/callback \
            auth-skeleton:ci alembic upgrade head

      - name: Smoke test the image
        run: |
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgresql+psycopg://auth:auth@localhost:5432/auth \
            -e ENTRA_TENANT_ID=11111111-1111-1111-1111-111111111111 \
            -e ENTRA_CLIENT_ID=22222222-2222-2222-2222-222222222222 \
            -e ENTRA_CLIENT_SECRET=ci \
            -e REDIRECT_URI=https://app.example/auth/callback \
            auth-skeleton:ci
          curl -sf --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:57005/healthz \
            || { docker logs smoke; exit 1; }
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:57005/auth/me)" = "401"
          test "$(docker exec smoke id -un)" = "app"
