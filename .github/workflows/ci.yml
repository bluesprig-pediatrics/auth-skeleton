name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql+psycopg://auth:auth@localhost:5432/auth
  ENV: test
  ENTRA_TENANT_ID: 11111111-1111-1111-1111-111111111111
  ENTRA_CLIENT_ID: 22222222-2222-2222-2222-222222222222
  ENTRA_CLIENT_SECRET: test
  REDIRECT_URI: http://localhost:57005/auth/callback

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: auth
          POSTGRES_PASSWORD: auth
          POSTGRES_DB: auth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy src
      - name: Lint migrations
        run: uv run alembic upgrade base:head --sql | uv run squawk
      - name: Test
        run: uv run pytest -q
