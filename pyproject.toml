[project]
name = "auth-skeleton"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "sqlmodel>=0.0.39",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "squawk-cli>=2.63.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Generated files: an empty revision genuinely does not use `sa`, and
# Alembic's import order is its own.
"alembic/versions/*" = ["F401", "I001", "E501"]
# S101 assert, S105/S106 literal token values in fixtures.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
mypy_path = "src"
